# API ByLAB → host 127.0.0.1:3040 (API_PORT no .env)
# Instalar: sudo cp deploy/nginx/api.luditeca.com.conf /etc/nginx/sites-available/
#           sudo ln -sf /etc/nginx/sites-available/api.luditeca.com.conf /etc/nginx/sites-enabled/
# SSL:      sudo certbot --nginx -d api.luditeca.com

server {
    listen 80;
    server_name api.luditeca.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
