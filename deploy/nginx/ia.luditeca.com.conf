# TecaAI (armário / IA) → host 127.0.0.1:5010 (TECAAI_PORT no .env)
# Prefixo /bylab evita conflito com outro serviço na mesma VPS
# Instalar: sudo cp deploy/nginx/ia.luditeca.com.conf /etc/nginx/sites-available/
#           sudo ln -sf /etc/nginx/sites-available/ia.luditeca.com.conf /etc/nginx/sites-enabled/
# SSL:      sudo certbot --nginx -d ia.luditeca.com

server {
    listen 80;
    server_name ia.luditeca.com;

    client_max_body_size 20M;

    location /bylab/ {
        proxy_pass http://127.0.0.1:5010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
