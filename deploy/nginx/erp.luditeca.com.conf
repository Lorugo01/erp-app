# ERP Flutter Web → container bylab-web
# Instalar: sudo cp deploy/nginx/erp.luditeca.com.conf /etc/nginx/sites-available/
#           sudo ln -sf /etc/nginx/sites-available/erp.luditeca.com.conf /etc/nginx/sites-enabled/
# SSL:      sudo certbot --nginx -d erp.luditeca.com

server {
    listen 80;
    server_name erp.luditeca.com;

    location / {
        proxy_pass http://127.0.0.1:9050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
